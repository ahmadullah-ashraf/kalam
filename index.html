<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="color-scheme" content="light dark">
<title>কালাম</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--g:#0f5c4d;--g2:#14806a;--gold:#c9a24a;--bg:#f6f4ec;--card:#fff;--tx:#1d2a26;--mu:#6b7a74;--bd:#e3dfd0;--me:#d9f2e6;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1714;--card:#16221e;--tx:#e8efec;--mu:#8fa19a;--bd:#263631;--me:#17493c}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%}
body{font-family:"Noto Sans Bengali","Kalpurush",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:12px 16px;font-weight:700;font-size:18px}
.logo{display:flex;align-items:center;gap:8px;color:#f3d98b}
main{flex:1;overflow-y:auto;padding:10px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;position:relative;font:inherit}
nav button.on{color:var(--g2)}nav small{font-size:11px}
.dot{position:absolute;top:6px;left:56%;width:9px;height:9px;border-radius:50%;background:var(--er)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
.b{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff!important;font:inherit;font-weight:700;margin:6px 0}
.b.o{background:none;border:1px solid var(--er);color:var(--er)}
.sm{padding:6px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--card);border-radius:14px;margin-bottom:8px;border:1px solid var(--bd)}
.gr{flex:1;min-width:0}.gr small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--g2),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cnt{background:var(--g2);color:#fff;border-radius:12px;padding:2px 8px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.card small{color:var(--mu);display:block}.card p{margin:6px 0;white-space:pre-wrap}
.ac{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.ac select{width:auto;margin:0;padding:6px}
.tag{background:var(--me);color:var(--g2);border-radius:8px;padding:2px 8px;font-size:12px;display:inline-block}.tag.rd{background:#f8d7d3;color:var(--er)}
